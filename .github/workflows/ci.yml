name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: api (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install ruff==0.7.0 pytest==8.3.3

      - name: Ruff
        run: ruff check app

      - name: Pytest
        env:
          SUPABASE_URL: https://stub.supabase.co
          SUPABASE_SERVICE_KEY: stub
          SUPABASE_ANON_KEY: stub
        run: pytest -q

  web:
    name: web (tsc + next lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --dir src

  celesc:
    name: celesc-monitor (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/celesc-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff
        run: |
          pip install ruff==0.7.0
          ruff check . --exclude __pycache__
