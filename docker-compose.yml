services:
  api:
    build: ./apps/api
    env_file: ./apps/api/.env
    ports: ["8000:8000"]
    restart: unless-stopped

  web:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./apps/web:/app"]
    env_file: ./apps/web/.env
    command: sh -c "npm install && npm run dev"
    ports: ["3000:3000"]
    depends_on: [api]
